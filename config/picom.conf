# Polder OS compositor (Revision 23): rounded corners + subtle shadows on normal app windows.
# Our own panels (shelf, QS, calendar, launcher, notifications, popups, lock) draw their own rounded shape with the
# wallpaper-backdrop trick, so picom must leave them alone: no corner clipping, no shadow, never unredirected.
backend = "xrender";          # glx breaks under virtio/llvmpipe in qemu; xrender works everywhere
vsync = false;
unredir-if-possible = false;
use-damage = true;
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'", "window_type = 'desktop'", "window_type = 'menu'", "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'", "window_type = 'tooltip'", "window_type = 'notification'", "override_redirect = true",
  "class_g = 'tint2'", "class_g ~= '[.]py$'", "class_i ~= '[.]py$'", "_NET_WM_STATE@[*] = '_NET_WM_STATE_FULLSCREEN'",
  "_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_VERT'"
];
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.22;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-exclude = [
  "window_type = 'dock'", "window_type = 'desktop'", "override_redirect = true", "class_g = 'tint2'",
  "class_g ~= '[.]py$'", "class_i ~= '[.]py$'", "_NET_WM_STATE@[*] = '_NET_WM_STATE_FULLSCREEN'"
];
fading = false;
detect-rounded-corners = false;
